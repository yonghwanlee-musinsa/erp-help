<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예산 FAQ 챗봇</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #4f6ef7;
    --accent2: #7c3aed;
    --text: #e8eaf6;
    --text-muted: #7b80a0;
    --user-bubble: #4f6ef7;
    --bot-bubble: #1e2235;
    --success: #34d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 배경 그라디언트 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(79,110,247,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 90%, rgba(124,58,237,0.1) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 헤더 */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15,17,23,0.8);
    backdrop-filter: blur(12px);
  }

  .bot-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-info h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .header-info p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    margin-right: 5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* API 키 설정 영역 */
  .api-setup {
    margin: 16px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .api-setup input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-setup input:focus { border-color: var(--accent); }
  .api-setup input::placeholder { color: var(--text-muted); }

  .api-setup label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .btn-save {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-save:hover { opacity: 0.85; }

  .api-saved-badge {
    display: none;
    font-size: 12px;
    color: var(--success);
    align-items: center;
    gap: 4px;
  }

  /* 채팅 영역 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* 메시지 */
  .message {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .message.bot .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  .message.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .msg-content {
    max-width: 75%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .message.user .msg-content { align-items: flex-end; }

  .msg-bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }

  .message.bot .msg-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .message.user .msg-bubble {
    background: var(--user-bubble);
    border-top-right-radius: 4px;
    color: white;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  /* 타이핑 인디케이터 */
  .typing-indicator {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .typing-dots {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* 빠른 질문 버튼 */
  .quick-questions {
    padding: 0 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(79,110,247,0.08);
  }

  /* 입력 영역 */
  .input-area {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
    background: rgba(15,17,23,0.9);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.1);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .input-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    text-align: center;
  }

  /* 웰컴 메시지 */
  .welcome {
    text-align: center;
    padding: 40px 20px 20px;
    color: var(--text-muted);
  }

  .welcome-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .welcome h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .welcome p {
    font-size: 13px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app-wrapper">
  <!-- 헤더 -->
  <div class="header">
    <div class="bot-avatar">💰</div>
    <div class="header-info">
      <h1>예산 FAQ 도우미</h1>
      <p><span class="status-dot"></span>예산 관련 문의에 답변드립니다</p>
    </div>
  </div>

  <!-- API 키 설정 -->
  <div class="api-setup" id="apiSetup">
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="Gemini API 키를 입력하세요 (AIza...)" />
    <button class="btn-save" onclick="saveApiKey()">저장</button>
    <span class="api-saved-badge" id="savedBadge">✓ 연결됨</span>
  </div>

  <!-- 채팅 영역 -->
  <div class="chat-area" id="chatArea">
    <div class="welcome">
      <div class="welcome-icon">🗂️</div>
      <h2>예산 문의 도우미입니다</h2>
      <p>예산 조회, 레벨활동비, 시스템 오류 등<br>예산 관련 궁금한 점을 자유롭게 질문해주세요.</p>
    </div>
  </div>

  <!-- 빠른 질문 -->
  <div class="quick-questions" id="quickQuestions">
    <button class="quick-btn" onclick="quickAsk('예산 조회가 안 돼요')">예산 조회 안됨</button>
    <button class="quick-btn" onclick="quickAsk('레벨활동비를 사용할 수 없어요')">레벨활동비 사용 불가</button>
    <button class="quick-btn" onclick="quickAsk('예산 신청은 어떻게 하나요?')">예산 신청 방법</button>
    <button class="quick-btn" onclick="quickAsk('예산 잔액 확인은 어디서 하나요?')">잔액 확인</button>
  </div>

  <!-- 입력 영역 -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="예산 관련 질문을 입력하세요..." rows="1"
        onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">Enter로 전송 · Shift+Enter로 줄바꿈</div>
  </div>
</div>

<script>
// ==========================================
// ✅ FAQ 내용을 여기에 추가/수정하세요
// ==========================================
const FAQ_CONTEXT = `
당신은 회사 내 예산 관련 문의를 답변하는 FAQ 도우미입니다.
아래 FAQ 내용을 기반으로 정확하고 친절하게 답변해주세요.
FAQ에 없는 내용이면 "해당 내용은 담당자 확인이 필요합니다. @담당자 에게 문의해주세요." 라고 안내해주세요.
답변은 간결하고 명확하게 해주세요. 마크다운 형식 없이 일반 텍스트로 답변해주세요.

[FAQ]
Q: 예산 조회가 안 돼요
A: 시스템 접근 권한 문제일 수 있습니다. IT 헬프데스크에 권한 요청을 해주세요. 또는 VPN 연결 상태를 확인해보세요.

Q: 레벨활동비를 사용할 수 없어요
A: 레벨활동비는 분기 초에 지급되며, 사용 가능 기간이 지나면 자동 소멸됩니다. 현재 잔액은 [시스템명] > 나의 활동비에서 확인 가능합니다.

Q: 예산 신청은 어떻게 하나요?
A: [시스템명]에서 예산 신청서를 작성 후 팀장 승인을 받으면 됩니다. 신청 후 영업일 3일 이내 처리됩니다.

Q: 예산 잔액 확인은 어디서 하나요?
A: [시스템명] > 예산관리 > 잔액현황 메뉴에서 확인 가능합니다.

// 여기에 FAQ를 계속 추가하세요
`;
// ==========================================

let apiKey = localStorage.getItem('gemini_api_key') || '';
let isLoading = false;

// 초기화
window.onload = () => {
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  if (apiKey) {
    showSavedBadge();
    document.getElementById('apiKeyInput').value = apiKey;
  }

  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || isLoading;
  });
};

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) return alert('API 키를 입력해주세요.');
  apiKey = key;
  localStorage.setItem('gemini_api_key', key);
  showSavedBadge();
}

function showSavedBadge() {
  document.getElementById('savedBadge').style.display = 'flex';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickAsk(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function getTime() {
  return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, role) {
  const chatArea = document.getElementById('chatArea');

  // 웰컴 메시지 숨기기
  const welcome = chatArea.querySelector('.welcome');
  if (welcome) welcome.style.display = 'none';

  // 빠른 질문 숨기기
  document.getElementById('quickQuestions').style.display = 'none';

  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'bot' ? '💰' : '👤'}</div>
    <div class="msg-content">
      <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${getTime()}</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="msg-avatar bot-avatar" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4f6ef7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:14px;">💰</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  if (!apiKey) return alert('먼저 Gemini API 키를 입력하고 저장해주세요.');

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  isLoading = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  addMessage(text, 'user');
  showTyping();

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `${FAQ_CONTEXT}\n\n사용자 질문: ${text}`
            }]
          }],
          generationConfig: {
            temperature: 0.3,
            maxOutputTokens: 500
          }
        })
      }
    );

    const data = await response.json();

    if (data.error) throw new Error(data.error.message);

    const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || '답변을 가져오지 못했습니다.';
    hideTyping();
    addMessage(answer, 'bot');

  } catch (err) {
    hideTyping();
    addMessage(`오류가 발생했습니다: ${err.message}\nAPI 키를 확인해주세요.`, 'bot');
  }

  isLoading = false;
}
</script>
</body>
</html>
